<!-- TEKNOBIZ FOTOĞRAF + ÖZELLEŞTİRME GÜNCELLEMESİ -->
<style>
/* Gerçek telefon fotoğrafı özelleştirici */
.real-phone-stage{
  position:relative;
  z-index:2;
  width:280px;
  height:530px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.real-phone-frame{
  position:relative;
  width:235px;
  height:500px;
  padding:8px;
  border-radius:38px;
  background:linear-gradient(145deg,#222b36,#080c12);
  box-shadow:0 28px 60px rgba(0,0,0,.55);
  transform:rotate(-1.5deg);
  transition:.3s;
}
.real-phone-frame img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:31px;
  background:#111;
}
.real-case-overlay{
  position:absolute;
  inset:1px;
  border-radius:40px;
  pointer-events:none;
  z-index:5;
  transition:.3s;
}
.real-case-overlay.transparent{
  border:8px solid rgba(220,240,255,.42);
  box-shadow:inset 0 0 18px rgba(255,255,255,.22),0 0 18px rgba(90,190,255,.22);
}
.real-case-overlay.transparent:after{
  content:"";
  position:absolute;
  width:82px;height:82px;
  border:3px solid rgba(255,255,255,.38);
  border-radius:50%;
  left:50%;top:54%;
  transform:translate(-50%,-50%);
}
.real-case-overlay.guess{
  border:11px solid #62402b;
  box-shadow:inset 0 0 5px rgba(255,220,170,.3),0 0 20px rgba(110,60,25,.3);
}
.real-case-overlay.guess:after{
  content:"GUESS";
  position:absolute;
  bottom:65px;left:50%;
  transform:translateX(-50%);
  color:#d9b267;border:1px solid #d9b267;
  padding:5px 8px;border-radius:5px;font-size:8px;font-weight:900;
  letter-spacing:1px;background:rgba(40,20,10,.55);
}
.real-case-overlay.single{
  border:11px solid var(--case-color,#111);
  box-shadow:inset 0 0 15px rgba(255,255,255,.1);
}
.real-case-overlay.rhinestone{
  border:10px solid #111;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.16),0 0 20px rgba(255,255,255,.15);
}
.real-case-overlay.rhinestone:after{
  content:"✦  ✧  ✦  ✧  ✦";
  position:absolute;left:0;right:0;bottom:72px;
  text-align:center;color:#fff;font-size:14px;letter-spacing:4px;
  text-shadow:0 0 8px #fff;
}
.real-case-overlay.carbon{
  border:11px solid #15191e;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 4px,transparent 4px 8px),
             repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0 4px,transparent 4px 8px);
  box-shadow:inset 0 0 12px rgba(255,255,255,.06);
}
.real-phone-caption{
  position:absolute;
  left:0;right:0;bottom:-32px;
  text-align:center;color:#9eb0c6;font-size:11px;font-weight:800;
}
.photo-note{
  position:absolute;
  left:18px;right:18px;bottom:18px;
  color:#7188a2;font-size:10px;text-align:center;
}
</style>

<script>
/* =========================================================
   TEKNOBİZ GERÇEK FOTOĞRAF GÜNCELLEMESİ
   Bu kod mevcut index.html'nin en altına eklenebilir.
========================================================= */

(function(){

  /* A17 ve iPhone 16 Pro Max kaldır */
  const oldIphones = [...iphoneModels];
  iphoneModels.splice(
    0,
    iphoneModels.length,
    ...oldIphones.filter(m => m !== "iPhone 16 Pro Max")
  );

  const oldAndroid = [...androidModels];
  androidModels.splice(
    0,
    androidModels.length,
    ...oldAndroid.filter(m => m !== "Samsung Galaxy A17")
  );

  /* Gerçek ürün fotoğrafları */
  const realChargerPhotos = {
    11:"https://ayagroup.com/cdn/shop/products/626625c37443899ca16ddca9814fa42f.jpg?v=1539692176",
    12:"https://cdn.shopify.com/s/files/1/0550/9188/8211/files/acc-app-muvv3z-0001_01.png?v=1720096341",
    13:"https://cdn.shopify.com/s/files/1/0945/7087/3126/files/6AAF9511-9F06-4853-9371-1557F40A0B7C.jpg?v=1765160267",
    14:"https://www.ontechsmartservices.com/cdn/shop/files/MyBatUSB-CtoCCable_1200x1200.jpg?v=1750949109",
    15:"https://cdn.shopify.com/s/files/1/0550/9188/8211/files/acc-app-muvv3z-0001_02.png?v=1720096341",
    16:"https://cdn.shopify.com/s/files/1/0945/7087/3126/files/80F8D41F-A464-4F35-BF58-74517EA2D189.jpg?v=1765160267"
  };

  products.forEach(p=>{
    if(realChargerPhotos[p.id]) p.image = realChargerPhotos[p.id];
  });

  /* Gerçek telefon arka yüz fotoğrafları.
     Wikimedia Commons Special:Redirect bağlantıları doğrudan görsel döndürür. */
  const phonePhotos = {
    "11":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Scan_of_back_of_iPhone_11_Pro_Max_Space_Grey.jpg",
    "12":"https://commons.wikimedia.org/wiki/Special:Redirect/file/IPhone_12_Pro_backside.jpg",
    "13":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Back_of_the_iPhone_13_Pro.jpg",
    "14":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Back_of_the_iPhone_14_Pro.jpg",
    "15":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Back_view_of_iPhone_15_Pro_Natural_titanium.jpg",
    "16":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Back_of_iPhone_16_Pro_-_1.jpg",
    "17":"https://commons.wikimedia.org/wiki/Special:Redirect/file/IPhone_17_(Lavender)_-_Backside.jpg",
    "17pro":"https://commons.wikimedia.org/wiki/Special:Redirect/file/IPhone_17_Pro_(Silver)_-_Backside.jpg",
    "17promax":"https://commons.wikimedia.org/wiki/Special:Redirect/file/IPhone_17_Pro_Max_backside_(Silver)_(Oct_1,_2025).jpg",
    "18":"https://commons.wikimedia.org/wiki/Special:Redirect/file/IPhone_18_Pro_black_rear.jpg",
    "18pro":"https://commons.wikimedia.org/wiki/Special:Redirect/file/IPhone_18_Pro_black_rear.jpg",
    "18promax":"https://commons.wikimedia.org/wiki/Special:Redirect/file/IPhone_18_Pro_Max_black_rear.jpg"
  };

  function generation(model){
    const m = String(model);
    if(m.includes("11")) return "11";
    if(m.includes("12")) return "12";
    if(m.includes("13")) return "13";
    if(m.includes("14")) return "14";
    if(m.includes("15")) return "15";
    if(m.includes("16")) return "16";
    if(m.includes("17")) return "17";
    if(m.includes("18")) return "18";
    return "17";
  }

  function getPhoneBackImage(model){
    const g = generation(model);
    if(g==="17" && /Pro Max/.test(model)) return phonePhotos["17promax"];
    if(g==="17" && /Pro/.test(model)) return phonePhotos["17pro"];
    if(g==="18" && /Pro Max/.test(model)) return phonePhotos["18promax"];
    if(g==="18" && /Pro/.test(model)) return phonePhotos["18pro"];
    return phonePhotos[g] || phonePhotos["17"];
  }

  window.getPhoneBackImage = getPhoneBackImage;

  /* Özelleştirici telefon bölümünü gerçek fotoğraf alanıyla değiştir */
  function installRealCustomizer(){
    const panel = document.querySelector(".phone-panel");
    if(!panel) return;

    panel.innerHTML = `
      <div class="real-phone-stage">
        <div class="real-phone-frame" id="realPhoneFrame">
          <img id="realPhoneImage"
               src="${getPhoneBackImage(customState.model)}"
               alt="${escapeHTML(customState.model)} arka yüz"
               onerror="this.style.opacity='.35'">
          <div class="real-case-overlay transparent" id="realCaseOverlay"></div>
          <div class="real-phone-caption" id="realPhoneCaption">
            ${escapeHTML(customState.model)}
          </div>
        </div>
      </div>
      <div class="photo-note">
        Model seçtikçe gerçek telefonun arka yüz fotoğrafı değişir.
      </div>
    `;
  }

  /* Eski CSS çizimini tamamen etkisizleştir */
  function updateRealPreview(){
    const img = document.getElementById("realPhoneImage");
    const overlay = document.getElementById("realCaseOverlay");
    const caption = document.getElementById("realPhoneCaption");

    if(!img || !overlay) return;

    img.src = getPhoneBackImage(customState.model);
    img.alt = customState.model + " arka yüz";
    caption.textContent = customState.model;

    overlay.className = "real-case-overlay " + customState.caseType;
    overlay.style.setProperty(
      "--case-color",
      getCaseCSSColor(customState.color)
    );
  }

  /* Mevcut updatePhonePreview fonksiyonunu sar */
  const originalUpdatePhonePreview = window.updatePhonePreview;
  window.updatePhonePreview = function(){
    try{
      if(typeof originalUpdatePhonePreview === "function"){
        originalUpdatePhonePreview();
      }
    }catch(e){}

    updateRealPreview();
  };

  /* addCustomizedToCart'taki fotoğrafı da gerçek telefon yap */
  const originalAddCustomized = window.addCustomizedToCart;
  window.addCustomizedToCart = function(){
    const item = {
      cartId:Date.now()+Math.random(),
      productId:"custom-"+customState.productId,
      title:`${customState.model} ${customState.caseName}`,
      price:customState.price,
      image:getPhoneBackImage(customState.model),
      custom:true,
      model:customState.model,
      caseName:customState.caseName,
      caseType:customState.caseType,
      color:customState.color
    };

    cart.push(item);
    updateCart();
    closeCustomizer();
    openCart();
  };

  /* Model listesi artık A17/16 Pro Max içermiyor */
  const originalPopulate = window.populateCustomModels;
  window.populateCustomModels = function(){
    const select = document.getElementById("customModel");
    if(!select) return;

    select.innerHTML = iphoneModels.map(model=>`
      <option value="${escapeHTML(model)}"
        ${model===customState.model ? "selected":""}>
        ${escapeHTML(model)}
      </option>
    `).join("");

    select.value = customState.model;
  };

  /* Açma fonksiyonunu güvenli biçimde yeniden tanımla */
  window.openCustomizer = function(productId){
    const product = products.find(p=>p.id===productId);
    if(!product || product.category!=="Kılıf") return;

    customState.productId = productId;

    const defaultOption =
      caseOptions.find(o=>o.type===product.caseType) || caseOptions[0];

    customState.caseType = defaultOption.type;
    customState.caseName = defaultOption.name;
    customState.price = defaultOption.price;

    customState.model =
      product.models?.includes("iPhone 17 Pro")
        ? "iPhone 17 Pro"
        : product.models?.[0] || "iPhone 17 Pro";

    customState.color =
      customState.caseType==="single"
        ? "Siyah"
        : getFixedCaseColor(customState.caseType);

    document.getElementById("customizerModal").classList.add("active");

    populateCustomModels();
    renderCaseOptions();
    renderColorOptions();

    installRealCustomizer();
    updateRealPreview();

    document.getElementById("summaryModel").textContent=customState.model;
    document.getElementById("summaryCase").textContent=customState.caseName;
    document.getElementById("summaryColor").textContent=customState.color;
    document.getElementById("summaryPrice").textContent=formatPrice(customState.price);
  };

  /* Model değişince fotoğraf anında değişsin */
  window.selectCustomModel = function(model){
    customState.model = model;
    updateRealPreview();

    document.getElementById("summaryModel").textContent=model;
  };

  /* Kılıf değişince fotoğrafın üstündeki çerçeve değişsin */
  const originalSelectCase = window.selectCase;
  window.selectCase = function(type){
    if(typeof originalSelectCase==="function"){
      originalSelectCase(type);
    }
    updateRealPreview();
  };

  const originalSelectColor = window.selectColor;
  window.selectColor = function(color){
    if(typeof originalSelectColor==="function"){
      originalSelectColor(color);
    }
    updateRealPreview();
  };

  /* Filtreleri A17 ve 16 Pro Max'siz tekrar oluştur */
  populateFilters();
  renderProducts(products);
  updateCart();

})();
</script>
