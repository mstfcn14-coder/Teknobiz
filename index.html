<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#071426;
    color:#fff;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#08182b;
    border-bottom:1px solid #1d3c60;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.nav{
    max-width:1200px;
    margin:auto;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:27px;
    font-weight:900;
    color:#50baff;
    white-space:nowrap;
}

.search{
    flex:1;
    max-width:500px;
}

.search input{
    width:100%;
    padding:13px 17px;
    border:1px solid #2b4d70;
    border-radius:13px;
    background:#102640;
    color:#fff;
    outline:none;
    font-size:15px;
}

.search input:focus{
    border-color:#168cff;
    box-shadow:0 0 0 3px rgba(22,140,255,.12);
}

.cartBtn{
    border:0;
    background:#168cff;
    color:#fff;
    padding:13px 17px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    white-space:nowrap;
}

.cartBtn:hover{
    background:#0877df;
}

/* HERO */

.hero{
    max-width:1200px;
    margin:28px auto;
    padding:55px 25px;
    border-radius:24px;
    background:
    radial-gradient(circle at 80% 20%,rgba(30,143,255,.25),transparent 35%),
    linear-gradient(135deg,#0c2c51,#08172b);
    border:1px solid #173b60;
}

.hero h1{
    font-size:44px;
    margin-bottom:12px;
}

.hero p{
    color:#aec4dc;
    font-size:17px;
}

/* CONTAINER */

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

/* FILTERS */

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:25px;
}

.filter{
    border:1px solid #294663;
    background:#102640;
    color:#fff;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
}

.filter:hover{
    border-color:#168cff;
}

.filter.active{
    background:#168cff;
    border-color:#168cff;
}

/* SEARCH RESULT */

.resultInfo{
    margin-bottom:15px;
    color:#9eb7d1;
    font-size:14px;
}

/* PRODUCTS */

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.card{
    background:#0d2038;
    border:1px solid #193a5c;
    border-radius:17px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    min-width:0;
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    border-color:#2d6da5;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.cardImage{
    width:100%;
    height:230px;
    background:#fff;
    position:relative;
    overflow:hidden;
}

.cardImage img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    padding:10px;
}

.badge{
    position:absolute;
    top:10px;
    left:10px;
    background:#168cff;
    color:#fff;
    padding:6px 9px;
    border-radius:8px;
    font-size:11px;
    font-weight:bold;
}

.cardBody{
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:10px;
    flex:1;
}

.card h3{
    font-size:17px;
    line-height:1.35;
}

.category{
    color:#82a4c4;
    font-size:12px;
}

.price{
    font-size:21px;
    font-weight:bold;
    color:#59c0ff;
    margin-top:auto;
}

.add{
    width:100%;
    border:0;
    border-radius:10px;
    padding:12px;
    background:#168cff;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.add:hover{
    background:#0877df;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    background:#0d2038;
    border:1px solid #193a5c;
    border-radius:16px;
    color:#9db4cc;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:5000;
}

.modal.open{
    display:flex;
}

.box{
    width:100%;
    max-width:520px;
    max-height:92vh;
    overflow:auto;
    background:#0d2038;
    border:1px solid #294663;
    border-radius:18px;
    padding:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.x{
    border:0;
    background:#233b55;
    color:#fff;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:24px;
    cursor:pointer;
}

.x:hover{
    background:#c93636;
}

/* CUSTOM CASE */

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.field select,
.field textarea{
    width:100%;
    background:#102640;
    color:#fff;
    border:1px solid #294663;
    border-radius:10px;
    padding:12px;
    outline:none;
}

.colors{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.color{
    padding:9px 13px;
    border-radius:9px;
    border:1px solid #355575;
    background:#102640;
    color:#fff;
    cursor:pointer;
}

.color.sel{
    background:#168cff;
    border-color:#168cff;
}

.previewWrap{
    text-align:center;
    margin-bottom:20px;
}

.case{
    width:190px;
    height:350px;
    margin:0 auto 10px;
    border:5px solid #333;
    border-radius:30px;
    position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.camera{
    position:absolute;
    top:18px;
    left:18px;
    width:65px;
    height:65px;
    border-radius:18px;
    background:#111;
    padding:9px;
}

.lens{
    display:block;
    width:17px;
    height:17px;
    border-radius:50%;
    background:#555;
    border:3px solid #222;
    position:absolute;
}

.l1{top:10px;left:10px}
.l2{top:10px;right:10px}
.l3{bottom:10px;left:24px}

.caseBrand{
    position:absolute;
    bottom:45px;
    width:100%;
    text-align:center;
    font-weight:bold;
    opacity:.65;
}

.primary{
    border:0;
    border-radius:11px;
    padding:14px;
    background:#168cff;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.primary:hover{
    background:#0877df;
}

/* CART */

.cartrow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:13px 0;
    border-bottom:1px solid #203c59;
}

.remove{
    border:0;
    background:#c93636;
    color:#fff;
    padding:8px 11px;
    border-radius:8px;
    cursor:pointer;
}

.cartTotal{
    font-size:21px;
    font-weight:bold;
    margin:20px 0;
}

.small{
    color:#9db4cc;
    font-size:13px;
}

/* FOOTER */

footer{
    margin-top:50px;
    background:#06101e;
    border-top:1px solid #193a5c;
    padding:35px 20px;
    text-align:center;
}

footer h2{
    color:#50baff;
    margin-bottom:10px;
}

footer p{
    color:#91a9c1;
    margin:5px 0;
}

/* WHATSAPP */

.whatsapp{
    position:fixed;
    right:20px;
    bottom:20px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:#25D366;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:29px;
    z-index:3000;
    box-shadow:0 8px 25px rgba(0,0,0,.35);
}

/* RESPONSIVE */

@media(max-width:900px){

    .products{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:650px){

    .nav{
        flex-wrap:wrap;
    }

    .logo{
        font-size:23px;
    }

    .search{
        order:3;
        flex-basis:100%;
        max-width:none;
    }

    .hero{
        margin:15px;
        padding:35px 20px;
    }

    .hero h1{
        font-size:31px;
    }

    .hero p{
        font-size:14px;
    }

    .container{
        padding:15px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .cardImage{
        height:180px;
    }

    .cardBody{
        padding:11px;
    }

    .card h3{
        font-size:14px;
    }

    .price{
        font-size:17px;
    }

    .add{
        font-size:13px;
        padding:10px;
    }

}

@media(max-width:400px){

    .cardImage{
        height:155px;
    }

    .hero h1{
        font-size:27px;
    }

}

</style>

/* =========================================================
   DEĞİŞKENLER
========================================================= */

let cart = [];

let editing = null;

let selectedColor = "";

let activeFilter = "all";


/* =========================================================
   KISA ID
========================================================= */

const $ = id =>
    document.getElementById(id);


/* =========================================================
   PARA
========================================================= */

function money(value){

    return new Intl.NumberFormat(
        "tr-TR",
        {
            style:"currency",
            currency:"TRY"
        }
    ).format(value);

}


/* =========================================================
   ÜRÜN BUL
========================================================= */

function product(id){

    return PRODUCTS.find(
        p => p.id === Number(id)
    );

}


/* =========================================================
   HTML GÜVENLİĞİ
========================================================= */

function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   YEDEK GÖRSEL
========================================================= */

function fallbackImage(productName){

    const svg = `
    <svg xmlns="http://www.w3.org/2000/svg"
         width="600"
         height="600"
         viewBox="0 0 600 600">

        <rect width="600" height="600" fill="#f4f7fa"/>

        <rect x="180"
              y="70"
              width="240"
              height="410"
              rx="40"
              fill="#111827"/>

        <circle
            cx="235"
            cy="130"
            r="22"
            fill="#374151"/>

        <circle
            cx="300"
            cy="130"
            r="22"
            fill="#374151"/>

        <circle
            cx="365"
            cy="130"
            r="22"
            fill="#374151"/>

        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial"
            font-size="25"
            font-weight="bold"
            fill="#111827">
            TeknoBiz
        </text>

    </svg>
    `;

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);

}


/* =========================================================
   ÜRÜNLERİ GÖSTER
========================================================= */

function renderProducts(){

    const search =
        $("search")
        .value
        .trim()
        .toLowerCase();

    const list =
        PRODUCTS.filter(p => {

            const categoryOK =
                activeFilter === "all" ||
                p.category === activeFilter;

            const searchOK =
                !search ||
                p.name
                    .toLowerCase()
                    .includes(search);

            return categoryOK && searchOK;

        });


    $("resultInfo").textContent =
        search
        ? `"${search}" için ${list.length} ürün bulundu.`
        : `${list.length} ürün gösteriliyor.`;


    if(!list.length){

        $("products").innerHTML = `
            <div class="empty">

                <h2>🔎 Ürün bulunamadı</h2>

                <p style="margin-top:10px">
                    Arama kelimesini veya kategori filtresini değiştir.
                </p>

            </div>
        `;

        return;

    }


    $("products").innerHTML =

        list.map(p => `

            <article class="card">

                <div class="cardImage">

                    <span class="badge">
                        ${escapeHtml(p.category)}
                    </span>

                    <img
                        src="${escapeHtml(p.image)}"
                        alt="${escapeHtml(p.name)}"
                        loading="lazy"
                        onerror="this.onerror=null;this.src=fallbackImage('${escapeHtml(p.name)}')"
                    >

                </div>


                <div class="cardBody">

                    <div class="category">
                        TeknoBiz
                    </div>

                    <h3>
                        ${escapeHtml(p.name)}
                    </h3>

                    <div class="price">
                        ${money(p.price)}
                    </div>

                    <button
                        class="add"
                        type="button"
                        data-add="${p.id}"
                    >

                        ${
                            p.category === "Kılıf"
                            ? "🎨 Özelleştir"
                            : "🛒 Sepete Ekle"
                        }

                    </button>

                </div>

            </article>

        `).join("");

}


/* =========================================================
   SEPETİ KAYDET
========================================================= */

function save(){

    localStorage.setItem(
        "teknoCart",
        JSON.stringify(

            cart.map(x => ({

                id:x.p.id,

                model:x.model || "",

                color:x.color || "",

                note:x.note || ""

            }))

        )
    );

}


/* =========================================================
   SEPETİ YÜKLE
========================================================= */

function load(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    "teknoCart"
                ) || "[]"
            );


        cart =
            saved
                .map(x => {

                    const p =
                        product(x.id);

                    if(!p)
                        return null;

                    return {

                        p,

                        model:x.model || "",

                        color:x.color || "",

                        note:x.note || ""

                    };

                })
                .filter(Boolean);

    }catch(error){

        cart = [];

    }


    updateCart();

}


/* =========================================================
   SEPET GÜNCELLE
========================================================= */

function updateCart(){

    $("count").textContent =
        cart.length;


    let total = 0;


    if(!cart.length){

        $("cartItems").innerHTML = `

            <p class="small">
                Sepet boş.
            </p>

        `;

    }else{

        $("cartItems").innerHTML =

            cart.map((item,index) => {

                total += item.p.price;


                return `

                    <div class="cartrow">

                        <div>

                            <b>
                                ${escapeHtml(
                                    item.p.name
                                )}
                            </b>

                            <div class="small">

                                ${money(item.p.price)}

                                ${
                                    item.model
                                    ? " • " +
                                      escapeHtml(item.model)
                                    : ""
                                }

                                ${
                                    item.color
                                    ? " • " +
                                      escapeHtml(item.color)
                                    : ""
                                }

                                ${
                                    item.note
                                    ? " • Not: " +
                                      escapeHtml(item.note)
                                    : ""
                                }

                            </div>

                        </div>


                        <button
                            class="remove"
                            type="button"
                            data-remove="${index}"
                        >
                            Sil
                        </button>

                    </div>

                `;

            }).join("");

    }


    $("cartTotal").textContent =
        "Toplam: " + money(total);

}


/* =========================================================
   SEPETE EKLE
========================================================= */

function add(id){

    const p =
        product(id);

    if(!p)
        return;


    if(p.category === "Kılıf"){

        openCustom(id);

        return;

    }


    cart.push({

        p:p,

        model:"",

        color:"",

        note:""

    });


    save();

    updateCart();


    alert(
        "Ürün sepete eklendi."
    );

}


/* =========================================================
   KILIF ÖZELLEŞTİR
========================================================= */

function openCustom(id){

    editing =
        product(id);

    if(!editing)
        return;


    selectedColor =
        editing.colors?.[0] || "";


    $("model").value =
        "iPhone 15";


    $("colorField").style.display =
        editing.id === 3
        ? "block"
        : "none";


    $("colors").innerHTML =

        editing.id === 3

        ? editing.colors.map(color => `

            <button
                class="color ${
                    color === selectedColor
                    ? "sel"
                    : ""
                }"
                type="button"
                data-color="${escapeHtml(color)}"
            >
                ${escapeHtml(color)}
            </button>

        `).join("")

        : "";


    renderCase();


    $("customNote").value = "";


    $("customModal")
        .classList
        .add("open");

}


/* =========================================================
   TELEFON KILIFI GÖRÜNÜMÜ
========================================================= */

function renderCase(){

    const model =
        $("model").value ||
        "iPhone 15";


    const pro =
        /Pro/.test(model);


    $("camera").style.display =
        "block";


    $("camera").innerHTML =

        pro

        ? `

            <i class="lens l1"></i>
            <i class="lens l2"></i>
            <i class="lens l3"></i>

        `

        : `

            <i class="lens l1"></i>
            <i class="lens l2"></i>

        `;


    $("cameraInfo").textContent =

        (
            pro
            ? "Üçlü kamera kesimi"
            : "Çift kamera kesimi"
        )
        + " • "
        + model;


    const color =
        selectedColor || "Siyah";


    const backgrounds = {

        "Şeffaf":
            "linear-gradient(135deg,#dff6ff99,#ffffff22)",

        "Siyah":
            "#111",

        "Lacivert":
            "#0b2d59",

        "Mor":
            "#5b2a83",

        "Kırmızı":
            "#9d2028",

        "Beyaz":
            "#eee",

        "Yeşil":
            "#176b46"

    };


    $("case").style.background =
        backgrounds[color] || "#111";

}


/* =========================================================
   ÖZEL KILIFI SEPETE EKLE
========================================================= */

function addCustomized(){

    if(!editing)
        return;


    const model =
        $("model").value || "";


    const color =
        editing.id === 3
        ? selectedColor
        : "";


    const note =
        $("customNote")
        .value
        .trim();


    cart.push({

        p:editing,

        model:model,

        color:color,

        note:note

    });


    save();

    updateCart();


    $("customModal")
        .classList
        .remove("open");


    $("customNote").value = "";

    editing = null;


    alert(
        "Özelleştirilmiş kılıf sepete eklendi."
    );

}


/* =========================================================
   WHATSAPP SİPARİŞ
========================================================= */

function sendWhatsApp(){

    if(!cart.length){

        alert(
            "Sepet boş."
        );

        return;

    }


    let total = 0;


    let message =
        "Merhaba TeknoBiz, web sitesinden sipariş vermek istiyorum.\n\n";


    cart.forEach((item,index) => {

        total += item.p.price;


        message +=

            `${index + 1}. ${item.p.name} - ${money(item.p.price)}\n`;


        if(item.model){

            message +=
                `Model: ${item.model}\n`;

        }


        if(item.color){

            message +=
                `Renk: ${item.color}\n`;

        }


        if(item.note){

            message +=
                `Not: ${item.note}\n`;

        }


        message += "\n";

    });


    message +=
        `Toplam: ${money(total)}`;


    window.open(
        "https://wa.me/905059999009?text=" +
        encodeURIComponent(message),
        "_blank"
    );

}

/* =========================================================
   GENEL TIKLAMALAR
========================================================= */

document.addEventListener(
    "click",
    event => {


        const addButton =
            event.target.closest(
                "[data-add]"
            );


        if(addButton){

            add(
                Number(
                    addButton.dataset.add
                )
            );

            return;

        }


        const colorButton =
            event.target.closest(
                "[data-color]"
            );


        if(colorButton){

            selectedColor =
                colorButton.dataset.color;


            document
                .querySelectorAll(
                    "[data-color]"
                )
                .forEach(btn =>
                    btn.classList.remove(
                        "sel"
                    )
                );


            colorButton.classList.add(
                "sel"
            );


            renderCase();

            return;

        }


        const removeButton =
            event.target.closest(
                "[data-remove]"
            );


        if(removeButton){

            cart.splice(
                Number(
                    removeButton.dataset.remove
                ),
                1
            );


            save();

            updateCart();

            return;

        }


        const filterButton =
            event.target.closest(
                "[data-filter]"
            );


        if(filterButton){

            activeFilter =
                filterButton.dataset.filter;


            document
                .querySelectorAll(
                    ".filter"
                )
                .forEach(btn =>
                    btn.classList.remove(
                        "active"
                    )
                );


            filterButton.classList.add(
                "active"
            );


            renderProducts();

        }

    }
);
