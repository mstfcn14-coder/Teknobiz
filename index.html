<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeknoBiz</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#071426;
    color:#fff;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#0b1d35;
    border-bottom:1px solid #183453;
}

.nav{
    max-width:1200px;
    margin:auto;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:25px;
    font-weight:800;
    color:#4db8ff;
}

.search{
    flex:1;
    max-width:500px;
}

.search input{
    width:100%;
    padding:12px 16px;
    border:1px solid #294663;
    border-radius:12px;
    background:#102640;
    color:#fff;
    outline:none;
}

.cartBtn{
    border:0;
    background:#168cff;
    color:white;
    padding:12px 17px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}

.hero{
    max-width:1200px;
    margin:30px auto;
    padding:45px 25px;
    border-radius:22px;
    background:linear-gradient(135deg,#0c2c51,#0b1930);
}

.hero h1{
    font-size:42px;
    margin-bottom:12px;
}

.hero p{
    color:#a9bfd8;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:25px;
}

.filter{
    border:1px solid #294663;
    background:#102640;
    color:#fff;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
}

.filter.active{
    background:#168cff;
    border-color:#168cff;
}

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.card{
    background:#0d2038;
    border:1px solid #193a5c;
    border-radius:16px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.card img{
    width:100%;
    height:230px;
    object-fit:contain;
    background:#fff;
}

.cardBody{
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:10px;
    flex:1;
}

.card h3{
    font-size:17px;
    line-height:1.35;
}

.price{
    font-size:20px;
    font-weight:bold;
    color:#59c0ff;
    margin-top:auto;
}

.add{
    width:100%;
    border:0;
    border-radius:10px;
    padding:12px;
    background:#168cff;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.add:hover{
    background:#0877df;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:500;
}

.modal.open{
    display:flex;
}

.box{
    width:100%;
    max-width:520px;
    max-height:92vh;
    overflow:auto;
    background:#0d2038;
    border:1px solid #294663;
    border-radius:18px;
    padding:20px;
}

.head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.x{
    border:0;
    background:#233b55;
    color:white;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:24px;
    cursor:pointer;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.field select,
.field textarea{
    width:100%;
    background:#102640;
    color:#fff;
    border:1px solid #294663;
    border-radius:10px;
    padding:12px;
    outline:none;
}

.colors{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.color{
    padding:9px 13px;
    border-radius:9px;
    border:1px solid #355575;
    background:#102640;
    color:#fff;
    cursor:pointer;
}

.color.sel{
    background:#168cff;
    border-color:#168cff;
}

.previewWrap{
    text-align:center;
    margin-bottom:20px;
}

.case{
    width:190px;
    height:350px;
    margin:0 auto 10px;
    border:5px solid #333;
    border-radius:30px;
    position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.camera{
    position:absolute;
    top:18px;
    left:18px;
    width:65px;
    height:65px;
    border-radius:18px;
    background:#111;
    padding:9px;
}

.lens{
    display:block;
    width:17px;
    height:17px;
    border-radius:50%;
    background:#555;
    border:3px solid #222;
    position:absolute;
}

.l1{top:10px;left:10px}
.l2{top:10px;right:10px}
.l3{bottom:10px;left:24px}

.caseBrand{
    position:absolute;
    bottom:45px;
    width:100%;
    text-align:center;
    font-weight:bold;
    opacity:.65;
}

.primary{
    border:0;
    border-radius:11px;
    padding:14px;
    background:#168cff;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.cartrow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:13px 0;
    border-bottom:1px solid #203c59;
}

.remove{
    border:0;
    background:#c93636;
    color:white;
    padding:8px 11px;
    border-radius:8px;
    cursor:pointer;
}

.cartTotal{
    font-size:21px;
    font-weight:bold;
    margin:20px 0;
}

.small{
    color:#9db4cc;
    font-size:13px;
}

@media(max-width:900px){
    .products{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:650px){
    .nav{
        flex-wrap:wrap;
    }

    .search{
        order:3;
        flex-basis:100%;
        max-width:none;
    }

    .hero h1{
        font-size:30px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .card img{
        height:180px;
    }

    .cardBody{
        padding:11px;
    }

    .card h3{
        font-size:14px;
    }

    .price{
        font-size:17px;
    }
}

@media(max-width:400px){
    .products{
        grid-template-columns:1fr 1fr;
    }

    .card img{
        height:150px;
    }
}
</style>
</head>

<body>

<header>
    <div class="nav">
        <div class="logo">TeknoBiz</div>

        <div class="search">
            <input
                id="search"
                type="search"
                placeholder="Ürün ara..."
            >
        </div>

        <button class="cartBtn" id="openCart">
            🛒 Sepet (<span id="count">0</span>)
        </button>
    </div>
</header>

<section class="hero">
    <div class="container">
        <h1>TeknoBiz</h1>
        <p>Telefon aksesuarları ve teknoloji ürünleri</p>
    </div>
</section>

<main class="container">

    <div class="filters">
        <button class="filter active" data-filter="all">Tümü</button>
        <button class="filter" data-filter="Kılıf">Kılıflar</button>
        <button class="filter" data-filter="Cam">Cam</button>
        <button class="filter" data-filter="Kablo">Kablolar</button>
        <button class="filter" data-filter="Aksesuar">Aksesuar</button>
    </div>

    <div class="products" id="products"></div>

</main>

<!-- ÖZELLEŞTİRME MODALI -->

<div class="modal" id="customModal">

    <div class="box">

        <div class="head">
            <h2>🎨 Kılıfını Özelleştir</h2>
            <button class="x" id="customClose">×</button>
        </div>

        <div class="previewWrap">

            <div class="case" id="case">

                <div class="camera" id="camera">
                    <i class="lens l1"></i>
                    <i class="lens l2"></i>
                    <i class="lens l3"></i>
                </div>

                <div class="caseBrand">
                    TeknoBiz
                </div>

            </div>

            <div class="small" id="cameraInfo">
                Model seç
            </div>

        </div>

        <div class="field">

            <label>📱 iPhone modeli</label>

            <select id="model"></select>

        </div>

        <div class="field" id="colorField">

            <label>🎨 Renk</label>

            <div class="colors" id="colors"></div>

        </div>

        <div class="field">

            <label>📝 Not</label>

            <textarea
                id="customNote"
                rows="3"
                placeholder="Özel isteğin..."
            ></textarea>

        </div>

        <button
            class="primary"
            id="customAdd"
            style="width:100%"
            type="button"
        >
            🛒 Özelleştir ve Sepete Ekle
        </button>

    </div>

</div>

<!-- SEPET -->

<div class="modal" id="cartModal">

    <div class="box">

        <div class="head">

            <h2>🛒 Sepetim</h2>

            <button class="x" id="cartClose">
                ×
            </button>

        </div>

        <div id="cartItems"></div>

        <div class="cartTotal" id="cartTotal">
            Toplam: ₺0
        </div>

        <button
            class="primary"
            id="whatsappBtn"
            style="width:100%"
            type="button"
        >
            🟢 WhatsApp'tan Sipariş Ver
        </button>

    </div>

</div>

<script>

const PRODUCTS = [

    {
        id:1,
        category:"Kılıf",
        name:"Guess 4G iPhone Kılıfı",
        price:750,
        key:"guess"
    },

    {
        id:2,
        category:"Kılıf",
        name:"Şeffaf MagSafe Uyumlu iPhone Kılıfı",
        price:750,
        key:"seffaf"
    },

    {
        id:3,
        category:"Kılıf",
        name:"Tek Renk iPhone Kılıfı",
        price:650,
        key:"tekrenk",
        colors:[
            "Lacivert",
            "Siyah",
            "Beyaz",
            "Kırmızı",
            "Mor",
            "Yeşil"
        ]
    },

    {
        id:4,
        category:"Kılıf",
        name:"Taşlı iPhone Kılıfı",
        price:650,
        key:"tasli"
    },

    {
        id:5,
        category:"Kılıf",
        name:"Karbon iPhone Kılıfı",
        price:1000,
        key:"karbon"
    },

    {
        id:6,
        category:"Cam",
        name:"Anti Statik Kırılmaz Cam",
        price:1000,
        key:"cam"
    },

    {
        id:7,
        category:"Aksesuar",
        name:"MagSafe Uyumlu Cüzdan",
        price:500,
        key:"cuzdan"
    },

    {
        id:8,
        category:"Aksesuar",
        name:"Işıklı Makyaj Aynası",
        price:750,
        key:"ayna"
    },

    {
        id:9,
        category:"Aksesuar",
        name:"Aromatik Difüzör",
        price:1750,
        key:"difuzor"
    },

    {
        id:10,
        category:"Aksesuar",
        name:"Apple 20W USB-C Güç Adaptörü",
        price:1149,
        key:"adapter20"
    },

    {
        id:11,
        category:"Kablo",
        name:"USB-C - Lightning Kablosu 1 m",
        price:1149,
        key:"kablo1"
    },

    {
        id:12,
        category:"Kablo",
        name:"USB-C - Lightning Kablosu 2 m",
        price:1599,
        key:"kablo2"
    },

    {
        id:13,
        category:"Aksesuar",
        name:"USB-C - Lightning Adaptörü",
        price:1599,
        key:"adapter"
    }

];

let cart = [];

let editing = null;

let selectedColor = "";

let activeFilter = "all";

const $ = id =>
    document.getElementById(id);

function money(value){

    return new Intl.NumberFormat(
        "tr-TR",
        {
            style:"currency",
            currency:"TRY"
        }
    ).format(value);

}

function product(id){

    return PRODUCTS.find(
        p => p.id === Number(id)
    );

}

function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

function renderProducts(){

    const search =
        $("search").value
        .trim()
        .toLowerCase();

    const list =
        PRODUCTS.filter(p => {

            const categoryOK =
                activeFilter === "all" ||
                p.category === activeFilter;

            const searchOK =
                !search ||
                p.name
                    .toLowerCase()
                    .includes(search);

            return categoryOK && searchOK;

        });

    $("products").innerHTML =
        list.map(p => `

            <article class="card">

                <img
                    src="${p.image || ""}"
                    alt="${escapeHtml(p.name)}"
                >

                <div class="cardBody">

                    <h3>
                        ${escapeHtml(p.name)}
                    </h3>

                    <div class="price">
                        ${money(p.price)}
                    </div>

                    <button
                        class="add"
                        type="button"
                        data-add="${p.id}"
                    >
                        ${p.category === "Kılıf"
                            ? "🎨 Özelleştir"
                            : "🛒 Sepete Ekle"}
                    </button>

                </div>

            </article>

        `).join("");

}

function save(){

    localStorage.setItem(
        "teknoCart",
        JSON.stringify(
            cart.map(x => ({
                id:x.p.id,
                model:x.model || "",
                color:x.color || "",
                note:x.note || ""
            }))
        )
    );

}

function load(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    "teknoCart"
                ) || "[]"
            );

        cart =
            saved
                .map(x => {

                    const p =
                        product(x.id);

                    if(!p) return null;

                    return {
                        p,
                        model:x.model || "",
                        color:x.color || "",
                        note:x.note || ""
                    };

                })
                .filter(Boolean);

    }catch(error){

        cart = [];

    }

    updateCart();

}

function updateCart(){

    $("count").textContent =
        cart.length;

    let total = 0;

    if(!cart.length){

        $("cartItems").innerHTML =
            `<p class="small">
                Sepet boş.
            </p>`;

    }else{

        $("cartItems").innerHTML =
            cart.map((item,index) => {

                total += item.p.price;

                return `

                    <div class="cartrow">

                        <div>

                            <b>
                                ${escapeHtml(
                                    item.p.name
                                )}
                            </b>

                            <div class="small">

                                ${money(item.p.price)}

                                ${
                                    item.model
                                    ? " • " +
                                      escapeHtml(
                                        item.model
                                      )
                                    : ""
                                }

                                ${
                                    item.color
                                    ? " • " +
                                      escapeHtml(
                                        item.color
                                      )
                                    : ""
                                }

                                ${
                                    item.note
                                    ? " • Not: " +
                                      escapeHtml(
                                        item.note
                                      )
                                    : ""
                                }

                            </div>

                        </div>

                        <button
                            class="remove"
                            type="button"
                            data-remove="${index}"
                        >
                            Sil
                        </button>

                    </div>

                `;

            }).join("");

    }

    $("cartTotal").textContent =
        "Toplam: " + money(total);

}

function add(id){

    const p =
        product(id);

    if(!p) return;

    if(p.category === "Kılıf"){

        openCustom(id);

        return;

    }

    cart.push({

        p:p,
        model:"",
        color:"",
        note:""

    });

    save();

    updateCart();

    alert(
        "Ürün sepete eklendi."
    );

}

function openCustom(id){

    editing =
        product(id);

    if(!editing) return;

    selectedColor =
        editing.colors?.[0] || "";

    $("model").value =
        "iPhone 15";

    $("colorField").style.display =
        editing.id === 3
        ? "block"
        : "none";

    $("colors").innerHTML =
        editing.id === 3
        ? editing.colors.map(
            color => `

                <button
                    class="color ${
                        color === selectedColor
                        ? "sel"
                        : ""
                    }"
                    type="button"
                    data-color="${escapeHtml(color)}"
                >
                    ${escapeHtml(color)}
                </button>

            `
        ).join("")
        : "";

    renderCase();

    $("customNote").value = "";

    $("customModal")
        .classList
        .add("open");

}

function renderCase(){

    const model =
        $("model").value ||
        "iPhone 15";

    const pro =
        /Pro/.test(model);

    $("camera").style.display =
        "block";

    $("camera").innerHTML =
        pro
        ? `
            <i class="lens l1"></i>
            <i class="lens l2"></i>
            <i class="lens l3"></i>
          `
        : `
            <i class="lens l1"></i>
            <i class="lens l2"></i>
          `;

    $("cameraInfo").textContent =
        (
            pro
            ? "Üçlü kamera kesimi"
            : "Çift kamera kesimi"
        )
        + " • "
        + model;

    const color =
        selectedColor || "Siyah";

    const backgrounds = {

        "Şeffaf":
            "linear-gradient(135deg,#dff6ff99,#ffffff22)",

        "Siyah":
            "#111",

        "Lacivert":
            "#0b2d59",

        "Mor":
            "#5b2a83",

        "Kırmızı":
            "#9d2028",

        "Beyaz":
            "#eee",

        "Yeşil":
            "#176b46"

    };

    $("case").style.background =
        backgrounds[color] || "#111";

}

function addCustomized(){

    if(!editing) return;

    const model =
        $("model").value || "";

    const color =
        editing.id === 3
        ? selectedColor
        : "";

    const note =
        $("customNote")
            .value
            .trim();

    cart.push({

        p:editing,

        model:model,

        color:color,

        note:note

    });

    save();

    updateCart();

    $("customModal")
        .classList
        .remove("open");

    $("customNote").value = "";

    editing = null;

    alert(
        "Özelleştirilmiş kılıf sepete eklendi."
    );

}

function sendWhatsApp(){

    if(!cart.length){

        alert("Sepet boş.");

        return;

    }

    let total = 0;

    let message =
        "Merhaba TeknoBiz, web sitesinden sipariş vermek istiyorum.%0A%0A";

    cart.forEach((item,index) => {

        total += item.p.price;

        message +=
            `${index + 1}. ${encodeURIComponent(item.p.name)} - ${encodeURIComponent(money(item.p.price))}%0A`;

        if(item.model){

            message +=
                `Model: ${encodeURIComponent(item.model)}%0A`;

        }

        if(item.color){

            message +=
                `Renk: ${encodeURIComponent(item.color)}%0A`;

        }

        if(item.note){

            message +=
                `Not: ${encodeURIComponent(item.note)}%0A`;

        }

        message += "%0A";

    });

    message +=
        `Toplam: ${encodeURIComponent(money(total))}`;

    window.location.href =
        "https://wa.me/905059999009?text="
        + message;

}

const models = [

    "iPhone 11",
    "iPhone 11 Pro",
    "iPhone 11 Pro Max",

    "iPhone 12",
    "iPhone 12 Pro",
    "iPhone 12 Pro Max",

    "iPhone 13",
    "iPhone 13 Pro",
    "iPhone 13 Pro Max",

    "iPhone 14",
    "iPhone 14 Pro",
    "iPhone 14 Pro Max",

    "iPhone 15",
    "iPhone 15 Plus",
    "iPhone 15 Pro",
    "iPhone 15 Pro Max",

    "iPhone 16",
    "iPhone 16 Plus",
    "iPhone 16 Pro",
    "iPhone 16 Pro Max",

    "iPhone 17",
    "iPhone 17 Pro",
    "iPhone 17 Pro Max"

];

$("model").innerHTML =
    models.map(
        model =>
            `<option value="${model}">
                ${model}
            </option>`
    ).join("");

$("customAdd")
    .addEventListener(
        "click",
        addCustomized
    );

$("model")
    .addEventListener(
        "change",
        renderCase
    );

$("openCart")
    .addEventListener(
        "click",
        () => {
            updateCart();
            $("cartModal")
                .classList
                .add("open");
        }
    );

$("cartClose")
    .addEventListener(
        "click",
        () => {
            $("cartModal")
                .classList
                .remove("open");
        }
    );

$("customClose")
    .addEventListener(
        "click",
        () => {
            $("customModal")
                .classList
                .remove("open");
        }
    );

$("whatsappBtn")
    .addEventListener(
        "click",
        sendWhatsApp
    );

$("search")
    .addEventListener(
        "input",
        renderProducts
    );

document.addEventListener(
    "click",
    event => {

        const addButton =
            event.target.closest(
                "[data-add]"
            );

        if(addButton){

            add(
                Number(
                    addButton.dataset.add
                )
            );

            return;

        }

        const colorButton =
            event.target.closest(
                "[data-color]"
            );

        if(colorButton){

            selectedColor =
                colorButton.dataset.color;

            document
                .querySelectorAll(
                    "[data-color]"
                )
                .forEach(btn =>
                    btn.classList.remove(
                        "sel"
                    )
                );

            colorButton.classList.add(
                "sel"
            );

            renderCase();

            return;

        }

        const removeButton =
            event.target.closest(
                "[data-remove]"
            );

        if(removeButton){

            cart.splice(
                Number(
                    removeButton.dataset.remove
                ),
                1
            );

            save();

            updateCart();

            return;

        }

        const filterButton =
            event.target.closest(
                "[data-filter]"
            );

        if(filterButton){

            activeFilter =
                filterButton.dataset.filter;

            document
                .querySelectorAll(
                    ".filter"
                )
                .forEach(btn =>
                    btn.classList.remove(
                        "active"
                    )
                );

            filterButton.classList.add(
                "active"
            );

            renderProducts();

        }

    }
);

window.addEventListener(
    "click",
    event => {

        if(
            event.target.classList.contains(
                "modal"
            )
        ){

            event.target
                .classList
                .remove("open");

        }

    }
);

load();

renderProducts();

</script>
